name: Release Package

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_package
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PLUGIN_SLUG: lightweight-seo
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: wp-cli

      - name: Validate tag matches plugin version
        shell: bash
        run: |
          set -euo pipefail

          plugin_version="$(sed -n 's/^ \* Version: //p' lightweight-seo.php | head -n1 | tr -d '\r')"
          tag_version="${RELEASE_TAG#v}"

          if [[ -z "${plugin_version}" ]]; then
            echo "Could not read the plugin version from lightweight-seo.php" >&2
            exit 1
          fi

          if [[ "${plugin_version}" != "${tag_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match plugin version ${plugin_version}" >&2
            exit 1
          fi

          echo "ZIP_NAME=${PLUGIN_SLUG}-${RELEASE_TAG}.zip" >> "${GITHUB_ENV}"

      - name: Build plugin zip
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          git archive --format=tar --worktree-attributes --prefix="${PLUGIN_SLUG}/" HEAD | tar -xf - -C dist

          (
            cd dist
            zip -qr "../${ZIP_NAME}" "${PLUGIN_SLUG}"
          )

      - name: Verify plugin zip
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "${ZIP_NAME}"
          unzip -Z1 "${ZIP_NAME}" > package-manifest.txt

          mapfile -t required_files < <(
            git ls-tree -r --name-only HEAD -- \
              lightweight-seo.php \
              uninstall.php \
              admin \
              includes
          )

          missing_files=0

          for required_file in "${required_files[@]}"; do
            if ! grep -Fqx "${PLUGIN_SLUG}/${required_file}" package-manifest.txt; then
              echo "Missing required plugin file: ${required_file}" >&2
              missing_files=1
            fi
          done

          if (( missing_files )); then
            exit 1
          fi

          echo "Verified ${#required_files[@]} required plugin files in ${ZIP_NAME}"

      - name: Smoke activate packaged plugin
        shell: bash
        run: |
          set -euo pipefail

          wp core download --path=/tmp/wordpress --quiet
          wp config create --path=/tmp/wordpress --dbname=wordpress_package --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          wp core install --path=/tmp/wordpress --url=http://127.0.0.1 --title="Package Smoke" --admin_user=admin --admin_password=package-smoke-password --admin_email=admin@example.com --skip-email --quiet
          unzip -q "${ZIP_NAME}" -d /tmp/wordpress/wp-content/plugins
          wp plugin activate "${PLUGIN_SLUG}" --path=/tmp/wordpress
          wp eval 'if ( ! lightweight_seo_get_api() ) { exit( 1 ); }' --path=/tmp/wordpress

      - name: Publish release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ZIP_NAME}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${ZIP_NAME}" --title "${RELEASE_TAG}" --generate-notes --verify-tag
          fi
